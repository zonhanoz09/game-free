[workspace]
resolver = "2"
members = [
    "apps/client",
    "apps/server",
    "crates/core",
    "crates/protocol",
    "crates/game_logic",
    "crates/data_schema",
]

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
