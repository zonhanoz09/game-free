apiVersion: apps/v1
kind: Deployment
metadata:
  name: tactical-arena-pvp
  labels:
    app: tactical-arena-pvp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tactical-arena-pvp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: tactical-arena-pvp
    spec:
      containers:
        - name: game-server
          image: tactical-arena-pvp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http-ws
          env:
            - name: PORT
              value: "8080"
            - name: RUST_LOG
              value: "info"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
