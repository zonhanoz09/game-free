services:
  tactical-arena-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tactical-arena-pvp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - RUST_LOG=info
    volumes:
      - ./wasm_dist:/app/wasm_dist
      - ./data:/app/data
